[package]
name = "bildwerk"
version = "0.2.0"
edition = "2021"
description = "KI-Bildverbesserung: Upscaling, Entrauschen, Gesichtsrestaurierung und Nachschärfen – in Rust"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
ndarray = "0.17"
rayon = "1"
anyhow = "1"
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[features]
default = ["ort-bundled"]
# Standard: ONNX Runtime wird beim Bauen automatisch heruntergeladen und neben das Programm kopiert
ort-bundled = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-native", "ort/api-27"]

# GPU-Beschleunigung (jeweils nur auf der passenden Plattform sinnvoll)
cuda = ["ort/cuda"]          # NVIDIA (Windows/Linux)
directml = ["ort/directml"]  # Windows: NVIDIA, AMD, Intel
coreml = ["ort/coreml"]      # macOS: Apple Silicon

# Windows-Installer: onnxruntime.dll (DirectML-Ausgabe) wird zur Laufzeit aus dem Programmordner geladen
windows-installer = ["ort/load-dynamic", "ort/directml", "ort/api-24"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 2
